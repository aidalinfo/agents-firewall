      - hermes
      summary: Tool calls reported by the Hermes plugin (`agent_plugin` token only; upsert by `id`)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ToolCallBatch'
      responses:
        '202':
          description: Accepted
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/Error'
  /enrollments:
    post:
      operationId: enrollAgent
      tags:
      - agents
      summary: Create an agent in a session (and a plugin token for Hermes agents)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnrollmentRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Enrollment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '423':
          $ref: '#/components/responses/Locked'
        default:
          $ref: '#/components/responses/Error'
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: 'OIDC access token or API token. Roles: admin > auditor > viewer; mcp_agent (reads like a viewer, writes only zones delegated to the MCP that are not its own, EF-51); agent_plugin (only /ingest/tool-calls and /intent-policy). Optional `X-Afw-Interface: ui|cli|mcp|api` header: declarative, recorded in the audit log, never used for authorization.'
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RevisionNumber:
      name: n
      in: path
      required: true
      schema:
        type: integer
        format: uint64
        minimum: 1
    Cursor:
      name: cursor
      in: query
      required: false
      description: '`next_cursor` of the previous page'
      schema:
        type: string
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 1000
        default: 100
    Session:
      name: X-Afw-Session
      in: header
      required: false
      description: Read the session's draft instead of the last published revision
      schema:
        type: string
        format: uuid
    SessionRequired:
      name: X-Afw-Session
      in: header
      required: true
      description: Session holding the change
      schema:
        type: string
        format: uuid
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Missing or invalid bearer token
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: Role or delegation does not allow this action
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Not found
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: Conflict (state, approval pending, already exists)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Locked:
      description: Resource locked by another session
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Error:
      description: Unexpected error
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Action:
      enum:
      - accept
      - deny
      type: string
    ActionClass:
      additionalProperties: false
      description: 'Class of tool actions evaluated by the Hermes plugin (format of ADR 0015). Applies when (`tools` is empty or a case-insensitive glob matches the tool name) and (`patterns` is empty or a regex matches the subject: tool name line, then one `key: value` line per argument). The same `id` may appear in several entries with different tool scopes.'
      properties:
        decision:
          $ref: '#/components/schemas/IntentDecision'
        id:
          type: string
        name:
          type: string
        patterns:
          items:
            type: string
          type: array
        tools:
          items:
            type: string
          type: array
      required:
      - decision
      - id
      - name
      - patterns
      - tools
      type: object
    Actor:
      properties:
        id:
          type: string
        kind:
          $ref: '#/components/schemas/ActorKind'
        name:
          type: string
      required:
      - id
      - kind
      - name
      type: object
    ActorKind:
      enum:
      - human
      - cli
      - agent
      - system
      type: string
    AdminAction:
      description: Recognised infrastructure administration call (internal flows, EF-82).
      properties:
        action:
          type: string
        resource:
          type: string
        system:
          $ref: '#/components/schemas/AdminSystem'
      required:
      - action
      - resource
      - system
      type: object
    AdminSystem:
      enum:
      - kubernetes
      - coolify
      - docker
      - proxmox
      type: string
    Agent:
      additionalProperties: false
      properties:
        addresses:
          default: []
          description: Source addresses identifying the agent on the gateway's internal network.
          items:
            format: ip
            type: string
          type: array
        gateway_id:
          default: null
          format: uuid
          type:
          - string
          - 'null'
        hermes:
          default: false
          type: boolean
        id:
          format: uuid
          type: string
        kind:
          $ref: '#/components/schemas/AgentKind'
        labels:
          additionalProperties:
            type: string
          default: {}
          type: object
        mcp_admin:
          default: false
          type: boolean
        name:
          type: string
        zone_id:
          format: uuid
          type: string
      required:
      - id
      - kind
      - name
      - zone_id
      type: object
    AgentKind:
      enum:
      - docker_compose
      - coolify
      - kubernetes
      - container
      type: string
    AgentOverview:
      description: '`GET /agents/{id}/overview` (EF-43).'
      properties:
        agent:
          $ref: '#/components/schemas/Agent'
        alerts:
          items:
            $ref: '#/components/schemas/AlertEvent'
          type: array
        bytes_in_24h:
          format: uint64
          minimum: 0.0
          type: integer
        bytes_out_24h:
          format: uint64
          minimum: 0.0
          type: integer
        denied_24h:
          format: uint64
          minimum: 0.0
          type: integer
        flows_24h:
          description: Counters over the last 24 hours.
          format: uint64
          minimum: 0.0
          type: integer
        gateway:
          anyOf:
          - $ref: '#/components/schemas/Gateway'
          - type: 'null'
        last_seen_at:
          format: date-time
          type:
          - string
          - 'null'
        recent_denied:
          items:
            $ref: '#/components/schemas/FlowEvent'
          type: array
        recent_tool_calls:
          items:
            $ref: '#/components/schemas/ToolCallEvent'
          type: array
        top_destinations:
          items:
            $ref: '#/components/schemas/DestinationStat'
          type: array
        zone:
          $ref: '#/components/schemas/Zone'
      required:
      - agent
      - alerts
      - bytes_in_24h
      - bytes_out_24h
      - denied_24h
      - flows_24h
      - recent_denied
      - recent_tool_calls
      - top_destinations
      - zone
      type: object
    Alert:
      description: 'Alert as listed by the API: the event plus its acknowledgement.'
      properties:
        acknowledged:
          type: boolean
        acknowledged_by:
          anyOf:
          - $ref: '#/components/schemas/Actor'
          - type: 'null'
        event:
          $ref: '#/components/schemas/AlertEvent'
        gateway_id:
          format: uuid
          type:
          - string
          - 'null'
      required:
      - acknowledged
      - event
      type: object
    AlertChannel:
      additionalProperties: false
      properties:
        enabled:
          type: boolean
        id:
          format: uuid
          type: string
        kind:
          $ref: '#/components/schemas/AlertChannelKind'
        min_severity:
          $ref: '#/components/schemas/Severity'
        name:
          type: string
        url:
          description: Target URL (secret parts masked on read).
          type: string
      required:
      - enabled
      - id
      - kind
      - min_severity
      - name
      - url
      type: object
    AlertChannelKind:
      enum:
      - webhook
      - teams
      - pulse_chat
      type: string
    AlertEvent:
      properties:
        agent_id:
          format: uuid
          type:
          - string
          - 'null'
        at:
          format: date-time
          type: string
        details:
          default: null
        id:
          format: uuid
          type: string
        kind:
          $ref: '#/components/schemas/AlertKind'
        severity:
          $ref: '#/components/schemas/Severity'
        summary:
          type: string
      required:
      - at
      - id
      - kind
      - severity
      - summary
      type: object
    AlertKind:
      enum:
      - new_destination
      - volume_spike
      - deny_burst
      - cloud_metadata
      - secret_detected
      - port_scan
      - new_internal_host
      - sensitive_port
      - internal_burst
      - unusual_admin_action
      type: string
    AllowDestination:
      description: Destination of a rule created from the log.
      oneOf:
      - description: The exact domain (or host IP) of the flow.
        enum:
        - exact
        type: string
      - description: '`*.<parent domain>` (refused when the parent is a top-level domain).'
        enum:
        - wildcard
        type: string
      - description: The exact domain added to the zone's "allowed from log" group.
        enum:
        - group
        type: string
    AllowFromLogRequest:
      additionalProperties: false
      description: '`POST /sessions/{id}/allow-from-log` (EF-42): creates a prefilled rule in the session.'
      properties:
        destination:
          $ref: '#/components/schemas/AllowDestination'
          default: exact
          description: How the destination is expressed (default `exact`).
        expires_in_days:
          default: null
          description: Expiry of the created rule, in days from now.
          format: uint32
          minimum: 0.0
          type:
          - integer
          - 'null'
        flow_id:
          format: uuid
          type: string
        track:
          anyOf:
          - $ref: '#/components/schemas/Track'
          - type: 'null'
          default: null
          description: Track level of the created rule (default `detailed`).
      required:
      - flow_id
      type: object
    AllowFromLogResponse:
      properties:
        changes:
          default: []
          description: Session changes made by this call.
          items:
            $ref: '#/components/schemas/SessionChange'
          type: array
        created_object:
          anyOf:
          - $ref: '#/components/schemas/NetObject'
          - type: 'null'
          description: Object created for the destination when no existing object matched.
        rule:
          $ref: '#/components/schemas/RuleView'
      required:
      - rule
      type: object
    AllowProposal:
      description: 'Rule proposed by the "Allow" button: source = the agent''s zone, accept, inserted at the top of the zone layer (see `POST /sessions/{id}/allow-from-log`).'
      properties:
        destinations:
          description: 'Choices, most specific first: exact, wildcard, then existing objects.'
          items:
            $ref: '#/components/schemas/ProposedDestination'
          type: array
        rule_number:
          description: Number the new rule would get in the current policy.
          format: uint32
          minimum: 0.0
          type:
          - integer
          - 'null'
        service:
          $ref: '#/components/schemas/ProposedService'
        zone_id:
          format: uuid
          type: string
        zone_name:
          type:
          - string
          - 'null'
      required:
      - destinations
      - service
      - zone_id
      type: object
    ApiToken:
      description: API token (the secret is only returned once, at creation).
      properties:
        agent_id:
          description: Agent bound to the token (`mcp_agent` role or Hermes plugin token).
          format: uuid
          type:
          - string
          - 'null'
        created_at:
          format: date-time
          type: string
        created_by:
          $ref: '#/components/schemas/Actor'
        expires_at:
          format: date-time
          type:
          - string
          - 'null'
        id:
          format: uuid
          type: string
        last_used_at:
          format: date-time
          type:
          - string
          - 'null'
        name:
          type: string
        role:
          $ref: '#/components/schemas/Role'
      required:
      - created_at
      - created_by
      - id
      - name
      - role
      type: object
    AppMatch:
      additionalProperties: false
      description: Application-level match (method and path prefixes apply to HTTP/HTTPS only).
      properties:
        methods:
          default: []
          items:
            type: string
          type: array
        path_prefixes:
          default: []
          items:
            type: string
          type: array
        proto:
          $ref: '#/components/schemas/AppProto'
      required:
      - proto
      type: object
    AppProto:
      enum:
      - http
      - https
      - dns
      - ssh
      - tls
      - other
      type: string
    Approval:
      description: Approval required before publishing a widening change (EF-52).
      properties:
        comment:
          type:
          - string
          - 'null'
        decided_at:
          format: date-time
          type:
          - string
          - 'null'
        decided_by:
          anyOf:
          - $ref: '#/components/schemas/Actor'
          - type: 'null'
        id:
          format: uuid
          type: string
        reason:
          type: string
        requested_at:
          format: date-time
          type: string
        requested_by:
          $ref: '#/components/schemas/Actor'
        session_id:
          format: uuid
          type: string
        status:
          $ref: '#/components/schemas/ApprovalStatus'
        summary:
          type: string
      required:
      - id
      - reason
      - requested_at
      - requested_by
      - session_id
      - status
      - summary
      type: object
    ApprovalDecision:
      additionalProperties: false
      description: '`POST /approvals/{id}/decision`.'
      properties:
        approve:
          type: boolean
        comment:
          type:
          - string
          - 'null'
      required:
      - approve
      type: object
    ApprovalStatus:
      enum:
      - pending
      - approved
      - rejected
      type: string
    AuditEntry:
      description: 'Hash-chained audit entry: `hash = sha256(prev_hash || canonical_json(entry without hash))`.'
      properties:
        action:
          type: string
        actor:
          $ref: '#/components/schemas/Actor'
        at:
          format: date-time
          type: string
        diff:
          default: null
        hash:
          type: string
        interface:
          $ref: '#/components/schemas/Interface'
        prev_hash:
          type: string
        seq:
          format: int64
          type: integer
        session_id:
          format: uuid
          type:
          - string
          - 'null'
        target:
          type: string
      required:
      - action
      - actor
      - at
      - hash
      - interface
      - prev_hash
      - seq
      - target
      type: object
    AuditVerifyResult:
      description: '`GET /audit/verify`.'
      properties:
        broken_at:
          description: '`seq` of the first broken entry.'
          format: int64
          type:
          - integer
          - 'null'
        checked:
          format: uint64
          minimum: 0.0
          type: integer
        head_hash:
          type:
          - string
          - 'null'
        head_seq:
          format: int64
          type:
          - integer
          - 'null'
        ok:
          type: boolean
      required:
      - checked
      - ok
      type: object
    BaselineLayerView:
      properties:
        sections:
          items:
            $ref: '#/components/schemas/RuleSection'
          type: array
      required:
      - sections
      type: object
    Body:
      description: Captured body, already masked before leaving the gateway.
      properties:
        data:
          type: string
        encoding:
          $ref: '#/components/schemas/BodyEncoding'
        sha256:
          description: SHA-256 (hex) of the original, unmasked body.
          type: string
        size:
          description: Original size in bytes.
          format: uint64
          minimum: 0.0
          type: integer
        truncated:
          type: boolean
      required:
      - data
      - encoding
      - sha256
      - size
      - truncated
      type: object
    BodyEncoding:
      enum:
      - utf8
      - base64
      type: string
    Capture:
      properties:
        agent_id:
          format: uuid
          type: string
        duration_secs:
          format: uint32
          minimum: 0.0
          type: integer
        error:
          type:
          - string
          - 'null'
        gateway_id:
          format: uuid
          type: string
        id:
          format: uuid
          type: string
        requested_at:
          format: date-time
          type: string
        requested_by:
          $ref: '#/components/schemas/Actor'
        size:
          format: uint64
          minimum: 0.0
          type:
          - integer
          - 'null'
        state:
          $ref: '#/components/schemas/CaptureState'
      required:
      - agent_id
      - duration_secs
      - gateway_id
      - id
      - requested_at
      - requested_by
      - state
      type: object
    CaptureRequest:
      additionalProperties: false
      description: '`POST /captures`.'
      properties:
        agent_id:
          format: uuid
          type: string
        duration_secs:
          format: uint32
          minimum: 0.0
          type: integer
      required:
      - agent_id
      - duration_secs
      type: object
    CaptureState:
      enum:
      - pending
      - running
      - done
      - failed
      type: string
    Change:
      properties:
        after: {}
        before: {}
        kind:
          $ref: '#/components/schemas/ChangeKind'
        resource:
          $ref: '#/components/schemas/ResourceRef'
      required:
      - kind
      - resource
      type: object
    ChangeKind:
      enum:
      - added
      - removed
      - modified
      type: string
    ChangeOp:
      description: Operation of a pending session change, relative to the last published revision.
      enum:
      - create
      - update
      - delete
      type: string
    Confidence:
      enum:
      - certain
      - probable
      - uncertain
      type: string
    Correlation:
      description: Flow <-> tool call correlation (ADR 0007).
      properties:
        confidence:
          $ref: '#/components/schemas/Confidence'
        conversation_id:
          type: string
        tool_call_id:
          format: uuid
          type: string
      required:
      - confidence
      - conversation_id
      - tool_call_id
      type: object
    CreateApiToken:
      additionalProperties: false
      description: '`POST /tokens`.'
      properties:
        agent_id:
          format: uuid
          type:
          - string
          - 'null'
        expires_at:
          format: date-time
          type:
          - string
          - 'null'
        name:
          type: string
        role:
          $ref: '#/components/schemas/Role'
      required:
      - name
      - role
      type: object
    CreateRegistrationToken:
      additionalProperties: false
      description: '`POST /gateways/registration-tokens`.'
      properties:
        name:
          description: Expected gateway name (informative).
          type:
          - string
          - 'null'
      type: object
    CreatedApiToken:
      properties:
        secret:
          description: Bearer secret, shown once.
          type: string
        token:
          $ref: '#/components/schemas/ApiToken'
      required:
      - secret
      - token
      type: object
    DataCategory:
      enum:
      - secret
      - infra
      - commercial
      - personal
      - custom
      type: string
    DataClass:
      additionalProperties: false
      properties:
        category:
          $ref: '#/components/schemas/DataCategory'
        comment:
          default: ''
          type: string
        detectors:
          items:
            $ref: '#/components/schemas/Detector'
          type: array
        id:
          format: uuid
          type: string
        name:
          type: string
      required:
      - category
      - detectors
      - id
      - name
      type: object
    DecisionRef:
      description: Which rule (or implicit rule) decided a flow.
      properties:
        layer:
          description: '`baseline`, `zone` or `implicit`.'
          type: string
        reason:
          type: string
        revision:
          description: Policy revision that took the decision; `None` when the gateway had no valid policy.
          format: uint64
          minimum: 0.0
          type:
          - integer
          - 'null'
        rule_id:
          format: uuid
          type:
          - string
          - 'null'
        rule_name:
          type: string
        rule_number:
          format: uint32
          minimum: 0.0
          type:
          - integer
          - 'null'
      required:
      - layer
      - reason
      - rule_name
      type: object
    DenyMode:
      description: How the gateway refused a denied flow.
      oneOf:
      - description: Explicit HTTP 403 with the EF-21 message (plain HTTP, inspected HTTPS, proxy CONNECT).
        enum:
        - http_403
        type: string
      - description: Connection reset (raw TCP, TLS refused before inspection).
        enum:
        - tcp_reset
        type: string
      - description: DNS answer `REFUSED`.
        enum:
        - dns_refused
        type: string
    DestCategory:
      description: Destination category. `LlmProvider` carries the data-class exemption (EF-25).
      enum:
      - llm_provider
      - cloud_metadata
      - internal
      type: string
    DestinationStat:
      properties:
        bytes_in:
          format: uint64
          minimum: 0.0
          type: integer
        bytes_out:
          format: uint64
          minimum: 0.0
          type: integer
        denied:
          format: uint64
          minimum: 0.0
          type: integer
        destination:
          type: string
        flows:
          format: uint64
          minimum: 0.0
          type: integer
        last_seen_at:
          format: date-time
          type: string
      required:
      - bytes_in
      - bytes_out
      - denied
      - destination
      - flows
      - last_seen_at
      type: object
    Detector:
      oneOf:
      - additionalProperties: false
        description: Built-in detector of `afw-dlp`, by id (e.g. `aws_access_key`).
        properties:
          id:
            type: string
          type:
            enum:
            - builtin
            type: string
        required:
        - id
        - type
        type: object
      - additionalProperties: false
        properties:
          name:
            type: string
          pattern:
            type: string
          type:
            enum:
            - regex
            type: string
        required:
        - name
        - pattern
        - type
        type: object
    DnsEvent:
      properties:
        agent_id:
          format: uuid
          type:
          - string
          - 'null'
        answers:
          default: []
          items:
            type: string
          type: array
        at:
          format: date-time
          type: string
        decision:
          $ref: '#/components/schemas/DecisionRef'
        gateway_id:
          format: uuid
          type: string
        id:
          format: uuid
          type: string
        qname:
          type: string
        qtype:
          type: string
        verdict:
          $ref: '#/components/schemas/Verdict'
        zone_id:
          format: uuid
          type:
          - string
          - 'null'
      required:
      - at
      - decision
      - gateway_id
      - id
      - qname
      - qtype
      - verdict
      type: object
    Enrollment:
      properties:
        agent:
          $ref: '#/components/schemas/Agent'
        plugin_token:
          description: Hermes plugin bearer token, shown once.
          type:
          - string
          - 'null'
        session_id:
          format: uuid
          type: string
      required:
      - agent
      - session_id
      type: object
    EnrollmentRequest:
      additionalProperties: false
      description: '`POST /enrollments`: creates the agent (in an open session) and, for Hermes agents, a plugin token.'
      properties:
        gateway_id:
          format: uuid
