[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/aidalinfo/agents-firewall"
rust-version = "1.91"

# Shared dependency versions. Every crate uses `dep = { workspace = true }`.
# Only Apache-2.0-compatible licenses (MIT, Apache-2.0, BSD, ISC, Zlib, Unicode-3.0).
[workspace.dependencies]
afw-core = { path = "crates/afw-core" }
afw-engine = { path = "crates/afw-engine" }
afw-dlp = { path = "crates/afw-dlp" }
afw-tls = { path = "crates/afw-tls" }
afw-client = { path = "crates/afw-client" }
afw-enroll = { path = "crates/afw-enroll" }
afw-import = { path = "crates/afw-import" }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
uuid = { version = "1", features = ["v4", "v7", "serde"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
ipnet = { version = "2", features = ["serde"] }
regex = "1"
# Public suffix list (MIT OR Apache-2.0).
psl = "2"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
flate2 = "1"
brotli = "8"
bytes = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
futures = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
rustls-pemfile = "2"
webpki-roots = "0.26"
rcgen = { version = "0.13", default-features = false, features = ["crypto", "pem", "ring", "x509-parser"] }
x509-parser = "0.16"
time = { version = "0.3", default-features = false, features = ["std"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
axum = { version = "0.8", features = ["macros", "ws"] }
axum-extra = { version = "0.10", features = ["cookie", "typed-header"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "fs"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "json", "macros", "migrate", "ipnetwork"] }
hickory-proto = "0.24"
clap = { version = "4", features = ["derive", "env"] }
toml = "0.8"
schemars = { version = "0.8", features = ["uuid1", "chrono"] }
aes-gcm = "0.10"
rand = "0.8"
jsonwebtoken = "9"
openidconnect = { version = "4", default-features = false, features = ["reqwest", "rustls-tls"] }
rmcp = { version = "0.8", features = ["server", "transport-io"] }
tempfile = "3"
libc = "0.2"
