        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: createObject
      tags:
      - policy
      summary: Create a Object in the session
      parameters:
      - $ref: '#/components/parameters/SessionRequired'
      requestBody:
        required: true
