      afw-internal:
        ipv4_address: 10.77.0.10
    dns:
    - 10.77.0.2
    sysctls:
      net.ipv4.conf.all.accept_redirects: 0
      net.ipv4.conf.default.accept_redirects: 0
    volumes:
    - gateway-public:/afw-ca-src:ro
