services:
  afw-net-acme:
    image: afw-netinit:local
    restart: unless-stopped
    cap_drop:
    - ALL
    cap_add:
    - NET_ADMIN
    environment:
      AFW_GATEWAY_IP: 10.80.0.2
      AFW_AGENT_IP: 10.80.0.11
    command:
    - sh
    - -c
    - |
      set -u
      GW='10.80.0.2'
      ME='10.80.0.11'
      CA_SRC='/afw-ca-src/gateway.crt'
      CA_DIR='/afw-ca'
      READY='/tmp/afw-ready'
      umask 022
      log() { echo "afw-net: $$*" >&2; }
      build_ca() {
        [ -d "$$CA_DIR" ] || return 0
        if [ ! -s "$$CA_SRC" ]; then log "gateway CA missing at $$CA_SRC"; return 1; fi
        if [ -s "$$CA_DIR/bundle.pem" ] && [ ! "$$CA_SRC" -nt "$$CA_DIR/bundle.pem" ]; then return 0; fi
        cp "$$CA_SRC" "$$CA_DIR/gateway.crt.tmp" && mv "$$CA_DIR/gateway.crt.tmp" "$$CA_DIR/gateway.crt" || return 1
        { cat /etc/ssl/certs/ca-certificates.crt 2>/dev/null || log "no system CA bundle"; echo; cat "$$CA_SRC"; } > "$$CA_DIR/bundle.pem.tmp" \
          && mv "$$CA_DIR/bundle.pem.tmp" "$$CA_DIR/bundle.pem"
      }
      apply() {
        IFACE=$$(ip -o addr show | awk -v me="$$ME/" 'index($$4, me) == 1 { sub(/@.*/, "", $$2); print $$2; exit }')
        if [ -z "$$IFACE" ]; then log "no interface holds $$ME"; return 1; fi
        for dev in $$(ls /sys/class/net); do
          [ "$$dev" = lo ] || [ "$$dev" = "$$IFACE" ] || ip link set dev "$$dev" down 2>/dev/null || log "cannot set $$dev down"
        done
        ip -4 route replace "$$GW/32" dev "$$IFACE" scope link || return 1
        ip -4 route replace default via "$$GW" dev "$$IFACE" || return 1
        ip -4 route show | while read -r dst rest; do
          case "$$dst" in
            default) case "$$rest" in "via $$GW dev $$IFACE"*) ;; *) ip -4 route del default $$rest ;; esac ;;
            "$$GW"|"$$GW/32") ;;
            *) ip -4 route del "$$dst" $$rest 2>/dev/null || ip -4 route del "$$dst" ;;
          esac
        done
        ip -6 route flush dev "$$IFACE" 2>/dev/null
        [ "$$(ip -4 route show | grep -vc -e '^default via '"$$GW"' dev ' -e '^'"$$GW"' ')" = 0 ] || return 1
        return 0
      }
      trap 'exit 0' TERM INT
      while :; do
        build_ca || rm -f "$$READY"
        if apply && { [ ! -d "$$CA_DIR" ] || [ -s "$$CA_DIR/bundle.pem" ]; }; then
          [ -f "$$READY" ] || touch "$$READY"
        else
          rm -f "$$READY"
        fi
        sleep 10 & wait $$!
      done
    networks:
      afw-internal:
        ipv4_address: 10.80.0.11
    dns:
    - 10.80.0.2
    sysctls:
      net.ipv4.conf.all.accept_redirects: 0
      net.ipv4.conf.default.accept_redirects: 0
    volumes:
    - /etc/afw/gateway-ca.crt:/afw-ca-src/gateway.crt:ro
    - afw-ca-acme:/afw-ca
    healthcheck:
      interval: 5s
      retries: 12
      test:
      - CMD-SHELL
      - test -f /tmp/afw-ready && test -s /afw-ca/bundle.pem
      timeout: 3s
    expose:
    - '9000'
    extra_hosts:
    - host.docker.internal:host-gateway
    labels:
      afw.enrolled: 'true'
      afw.agent: acme
  acme-bot:
    image: alpine:3.20
    labels:
    - team=clients
    - afw.enrolled=true
    - afw.agent=acme
    cap_drop:
    - NET_RAW
    network_mode: service:afw-net-acme
    depends_on:
      afw-net-acme:
        condition: service_healthy
    environment:
      HTTP_PROXY: http://10.80.0.2:3128
      HTTPS_PROXY: http://10.80.0.2:3128
      NO_PROXY: localhost,127.0.0.1,::1
      http_proxy: http://10.80.0.2:3128
      https_proxy: http://10.80.0.2:3128
      no_proxy: localhost,127.0.0.1,::1
      REQUESTS_CA_BUNDLE: /usr/local/share/ca-certificates/afw/bundle.pem
      SSL_CERT_FILE: /usr/local/share/ca-certificates/afw/bundle.pem
      CURL_CA_BUNDLE: /usr/local/share/ca-certificates/afw/bundle.pem
      NODE_EXTRA_CA_CERTS: /usr/local/share/ca-certificates/afw/gateway.crt
    volumes:
    - afw-ca-acme:/usr/local/share/ca-certificates/afw:ro
networks:
  afw-internal:
    external: true
x-custom:
  keep: me
volumes:
  afw-ca-acme: {}
x-afw-original:
  acme:
    service: acme-bot
    network: afw-internal
    definition:
      image: alpine:3.20
      networks:
        afw-internal:
          aliases:
          - acme
      expose:
      - '9000'
      extra_hosts:
      - host.docker.internal:host-gateway
      labels:
      - team=clients
    networks_key: true
    networks_null: false
    volumes_key: false
    volumes_null: false
    network_declaration:
      driver: bridge
