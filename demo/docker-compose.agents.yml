      REQUESTS_CA_BUNDLE: /usr/local/share/ca-certificates/afw/bundle.pem
      SSL_CERT_FILE: /usr/local/share/ca-certificates/afw/bundle.pem
      CURL_CA_BUNDLE: /usr/local/share/ca-certificates/afw/bundle.pem
      NODE_EXTRA_CA_CERTS: /usr/local/share/ca-certificates/afw/gateway.crt
      AFW_CONSOLE_URL: http://10.76.0.10:8080
      AFW_AGENT_TOKEN: ${AFW_DEMO_DANIEL_TOKEN}
      AFW_AGENT_NAME: daniel-bot
    security_opt:
    - no-new-privileges:true
    restart: unless-stopped
    mem_limit: 128m
    cap_drop:
    - NET_RAW
    network_mode: service:afw-net-daniel-bot
    depends_on:
      afw-net-daniel-bot:
        condition: service_healthy
    volumes:
    - afw-ca-daniel-bot:/usr/local/share/ca-certificates/afw:ro
    - ../integrations/hermes:/opt/data/plugins/agents-firewall:ro
    labels:
      afw.enrolled: 'true'
