{{- if .Values.console.enabled }}
{{- $fullname := include "afw.fullname" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}-console
  labels:
    {{- include "afw.labels" . | nindent 4 }}
    app.kubernetes.io/component: console
spec:
  replicas: {{ .Values.console.replicas }}
  selector:
    matchLabels:
      {{- include "afw.selector" (dict "ctx" . "component" "console") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "afw.selector" (dict "ctx" . "component" "console") | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.console.podSecurityContext | nindent 8 }}
      containers:
        - name: console
          image: {{ include "afw.image" .Values.console.image }}
          imagePullPolicy: {{ .Values.console.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.console.securityContext | nindent 12 }}
          env:
            - { name: NUXT_PUBLIC_API_MODE, value: http }
            - { name: NUXT_PUBLIC_API_BASE, value: {{ .Values.api.publicUrl | quote }} }
            - { name: PORT, value: "3000" }
          ports:
            - { name: http, containerPort: 3000, protocol: TCP }
          readinessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 10
          resources:
            {{- toYaml .Values.console.resources | nindent 12 }}
      {{- with .Values.console.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.console.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.console.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-console
  labels:
    {{- include "afw.labels" . | nindent 4 }}
    app.kubernetes.io/component: console
spec:
  type: {{ .Values.console.service.type }}
  selector:
    {{- include "afw.selector" (dict "ctx" . "component" "console") | nindent 4 }}
  ports:
    - { name: http, port: {{ .Values.console.service.port }}, targetPort: http, protocol: TCP }
{{- end }}
