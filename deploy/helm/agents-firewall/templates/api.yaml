{{- $fullname := include "afw.fullname" . -}}
{{- $dbSecret := ternary .Values.externalDatabase.existingSecret (include "afw.secretName" .) (and (not .Values.postgres.enabled) (ne .Values.externalDatabase.existingSecret "")) -}}
{{- if and (not .Values.postgres.enabled) (not .Values.externalDatabase.url) (not .Values.externalDatabase.existingSecret) (not .Values.secrets.existingSecret) }}
{{- fail "postgres.enabled=false requires externalDatabase.url, externalDatabase.existingSecret or secrets.existingSecret" }}
{{- end }}
{{- if gt (int .Values.api.replicas) 1 }}
{{- fail "api.replicas > 1 is not supported in V1 (the console PKI lives on the state volume)" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}-api
  labels:
    {{- include "afw.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicas }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "afw.selector" (dict "ctx" . "component" "api") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "afw.selector" (dict "ctx" . "component" "api") | nindent 8 }}
      annotations:
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.api.podSecurityContext | nindent 8 }}
      containers:
        - name: api
          image: {{ include "afw.image" .Values.api.image }}
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.api.securityContext | nindent 12 }}
          env:
            - { name: AFW_LISTEN, value: "0.0.0.0:8080" }
            - { name: AFW_GW_LISTEN, value: "0.0.0.0:8443" }
            - { name: AFW_PUBLIC_URL, value: {{ .Values.api.publicUrl | quote }} }
            - name: AFW_GW_SERVER_NAMES
              value: {{ printf "%s,%s-api-gw,%s-api-gw.%s.svc" .Values.api.publicHostnames $fullname $fullname .Release.Namespace | trimPrefix "," | quote }}
            - { name: AFW_STATE_DIR, value: /var/lib/afw-api }
            - { name: AFW_CONSOLE_CA_EXPORT, value: /var/lib/afw-api/public/console-ca.crt }
            - { name: AFW_AUDIT_EXPORT_DIR, value: /var/lib/afw-api/audit-export }
            - { name: AFW_LOG_STORE, value: {{ .Values.api.logStore | quote }} }
            - { name: AFW_CORS_ORIGINS, value: {{ .Values.api.publicUrl | quote }} }
            - { name: RUST_LOG, value: {{ .Values.api.logLevel | quote }} }
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: {{ $dbSecret }}, key: database-url } }
            - name: AFW_DATA_KEY
              valueFrom: { secretKeyRef: { name: {{ include "afw.secretName" . }}, key: data-key } }
            - name: AFW_BOOTSTRAP_ADMIN_TOKEN
              valueFrom: { secretKeyRef: { name: {{ include "afw.secretName" . }}, key: bootstrap-admin-token, optional: true } }
            {{- if eq .Values.api.logStore "clickhouse" }}
            - { name: AFW_CLICKHOUSE_URL, value: {{ required "api.clickhouse.url is required when api.logStore=clickhouse" .Values.api.clickhouse.url | quote }} }
            - { name: AFW_CLICKHOUSE_USER, value: {{ .Values.api.clickhouse.user | quote }} }
            {{- with .Values.api.clickhouse.existingSecret }}
            - name: AFW_CLICKHOUSE_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ . }}, key: clickhouse-password } }
            {{- end }}
            {{- end }}
            {{- with .Values.api.oidc.issuer }}
            - { name: AFW_OIDC_ISSUER, value: {{ . | quote }} }
            - { name: AFW_OIDC_CLIENT_ID, value: {{ $.Values.api.oidc.clientId | quote }} }
            - { name: AFW_OIDC_AUDIENCE, value: {{ $.Values.api.oidc.audience | quote }} }
            {{- end }}
            {{- with .Values.api.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - { name: http, containerPort: 8080, protocol: TCP }
            - { name: gateway, containerPort: 8443, protocol: TCP }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          volumeMounts:
            - { name: state, mountPath: /var/lib/afw-api }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: state
          {{- if .Values.api.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ $fullname }}-api-state
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: tmp
          emptyDir: {}
      {{- with .Values.api.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-api
  labels:
    {{- include "afw.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: {{ .Values.api.service.type }}
  selector:
    {{- include "afw.selector" (dict "ctx" . "component" "api") | nindent 4 }}
  ports:
    - { name: http, port: {{ .Values.api.service.port }}, targetPort: http, protocol: TCP }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-api-gw
  labels:
    {{- include "afw.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
  {{- with .Values.api.gatewayService.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.api.gatewayService.type }}
  selector:
    {{- include "afw.selector" (dict "ctx" . "component" "api") | nindent 4 }}
  ports:
    - { name: gateway, port: {{ .Values.api.gatewayService.port }}, targetPort: gateway, protocol: TCP }
{{- if .Values.api.persistence.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $fullname }}-api-state
  labels:
    {{- include "afw.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes: [ReadWriteOnce]
  {{- with .Values.api.persistence.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.api.persistence.size }}
{{- end }}
