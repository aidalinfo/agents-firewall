      description: Tool call reported by the Hermes plugin (`POST /api/v1/ingest/tool-calls`).
      properties:
        agent:
          description: Agent name or id.
          type: string
        args_summary:
          type: string
        conversation_id:
          type: string
        ended_at:
          format: date-time
          type:
          - string
          - 'null'
        id:
          format: uuid
          type: string
        started_at:
          format: date-time
          type: string
        status:
          type:
          - string
          - 'null'
        tool:
          type: string
      required:
      - agent
      - args_summary
      - conversation_id
      - id
      - started_at
      - tool
      type: object
    TraceOutcome:
      oneOf:
      - enum:
        - matched
        - not_matched
        type: string
      - description: Not evaluated (disabled, expired, or after the matching rule).
        enum:
        - skipped
        type: string
    TraceStep:
      description: One rule examined while evaluating a flow.
      properties:
        layer:
          description: '`baseline`, `zone` or `implicit`.'
          type: string
        outcome:
          $ref: '#/components/schemas/TraceOutcome'
        reason:
          description: Why it matched or not (e.g. `destination not in api-objects`).
          type: string
        rule_id:
          format: uuid
          type:
          - string
          - 'null'
        rule_label:
          type: string
        rule_number:
          format: uint32
          minimum: 0.0
          type:
          - integer
          - 'null'
      required:
      - layer
      - outcome
      - reason
      - rule_label
      type: object
    Track:
      enum:
      - none
      - log
      - detailed
      - capture
      type: string
    Verdict:
      enum:
      - allow
      - deny
      type: string
    VerifyFinding:
      description: Pre-install verification finding (EF-11), produced by `afw-engine`.
      oneOf:
      - description: '`rule` can never match because `by` (earlier) matches everything it matches.'
        properties:
          by:
            format: uuid
            type: string
          rule:
            format: uuid
            type: string
          type:
            enum:
            - shadowed
            type: string
        required:
        - by
        - rule
        - type
        type: object
      - properties:
          id:
            format: uuid
            type: string
          type:
            enum:
            - unused_object
            type: string
        required:
        - id
        - type
        type: object
      - properties:
          rule:
            format: uuid
            type: string
          type:
            enum:
            - expired
            type: string
        required:
        - rule
        - type
        type: object
    VerifyReport:
      description: '`GET /verify?revision=n`.'
      properties:
        findings:
          items:
            $ref: '#/components/schemas/VerifyFinding'
          type: array
        revision:
          description: Verified revision; absent = current session draft.
          format: uint64
          minimum: 0.0
          type:
          - integer
          - 'null'
      required:
      - findings
      type: object
    WhereUsed:
      description: '`GET /objects/{id}/where-used`.'
      properties:
        references:
          items:
            $ref: '#/components/schemas/ResourceRef'
          type: array
      required:
      - references
      type: object
    Zone:
      additionalProperties: false
      description: A zone groups agents (VLAN-like). A rule's source is always a zone, never an agent.
      properties:
        comment:
          default: ''
          type: string
        delegated_to_mcp:
          default: false
          type: boolean
        id:
          format: uuid
          type: string
        mode:
          $ref: '#/components/schemas/ZoneMode'
        name:
          type: string
      required:
      - id
      - mode
      - name
      type: object
    ZoneLayerView:
      properties:
        cleanup_number:
          description: 'Display number of the zone''s implicit cleanup rule ("deny everything"): the number following the zone''s last rule (display only, not part of the global numbering).'
          format: uint32
          minimum: 0.0
          type: integer
        mode:
          $ref: '#/components/schemas/ZoneMode'
        sections:
          items:
            $ref: '#/components/schemas/RuleSection'
          type: array
        zone:
          $ref: '#/components/schemas/Zone'
      required:
      - cleanup_number
      - mode
      - sections
      - zone
      type: object
    ZoneMode:
      description: '`Observe`: denials are logged but the flow is allowed (EF-12).'
      enum:
      - enforce
      - observe
      type: string
