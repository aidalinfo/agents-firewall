openapi: 3.1.0
info:
  title: agents-firewall API
  version: 1.0.0
  license:
    name: Apache-2.0
    identifier: Apache-2.0
  description: Control-plane REST API (contract-first, ADR 0008). Schemas under components.schemas are generated from the afw-core crate by `AFW_UPDATE_SCHEMAS=1 scripts/cargo.sh test -p afw-api --test openapi`; do not edit them by hand. Policy mutations happen in a session given by the `X-Afw-Session` header. Errors are `application/problem+json` (RFC 7807). Lists are paginated with an opaque cursor (`next_cursor`).
servers:
- url: /api/v1
security:
- bearer: []
tags:
- name: policy
- name: sessions
- name: revisions
- name: installs
- name: gateways
- name: logs
- name: captures
- name: alerts
- name: audit
- name: approvals
- name: auth
- name: hermes
- name: agents
