{{- if .Values.ingress.enabled }}
{{- $fullname := include "afw.fullname" . -}}
# Console on /, REST API on /api and /healthz. The gateway endpoint (mTLS) is exposed by the
# <fullname>-api-gw service, never through the ingress (TLS must not be terminated before the API).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "afw.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.tlsSecret }}
  tls:
    - hosts: [{{ $.Values.ingress.host | quote }}]
      secretName: {{ . }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service: { name: {{ $fullname }}-api, port: { name: http } }
          - path: /healthz
            pathType: Exact
            backend:
              service: { name: {{ $fullname }}-api, port: { name: http } }
          {{- if .Values.console.enabled }}
          - path: /
            pathType: Prefix
            backend:
              service: { name: {{ $fullname }}-console, port: { name: http } }
          {{- end }}
{{- end }}
