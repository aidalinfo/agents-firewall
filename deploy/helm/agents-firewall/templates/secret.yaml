{{- if not .Values.secrets.existingSecret }}
{{- /* `lookup` is empty under `helm template`, `--dry-run` and most GitOps tools: a generated secret would
       change at every render and make stored data unreadable. Refuse instead of generating silently. */ -}}
{{- $lookupOk := lookup "v1" "Namespace" "" .Release.Namespace -}}
{{- if and (not $lookupOk) (not .Values.secrets.dataKey) }}
{{- fail "secrets.dataKey (32 random bytes, base64) or secrets.existingSecret is required when the cluster cannot be queried (helm template, --dry-run, GitOps)" }}
{{- end }}
{{- if and (not $lookupOk) .Values.postgres.enabled (not .Values.postgres.password) }}
{{- fail "postgres.password or secrets.existingSecret is required when the cluster cannot be queried (helm template, --dry-run, GitOps)" }}
{{- end }}
{{- $pgPassword := include "afw.persisted" (dict "ctx" . "key" "postgres-password" "value" .Values.postgres.password "gen" (randAlphaNum 32)) | b64dec }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "afw.secretName" . }}
  labels:
    {{- include "afw.labels" . | nindent 4 }}
type: Opaque
data:
  data-key: {{ include "afw.persisted" (dict "ctx" . "key" "data-key" "value" .Values.secrets.dataKey "gen" (randAscii 32 | b64enc)) }}
  {{- with .Values.secrets.bootstrapAdminToken }}
  bootstrap-admin-token: {{ . | b64enc }}
  {{- end }}
  {{- if .Values.postgres.enabled }}
  postgres-password: {{ $pgPassword | b64enc }}
  database-url: {{ printf "postgres://%s:%s@%s:5432/%s" .Values.postgres.user $pgPassword (include "afw.postgresHost" .) .Values.postgres.database | b64enc }}
  {{- else if .Values.externalDatabase.url }}
  database-url: {{ .Values.externalDatabase.url | b64enc }}
  {{- end }}
{{- end }}
